name: Install-only authorization

run-name: Install-only authorization · ${{ inputs.purpose }} · ${{ inputs.request_id }} · artifact ${{ inputs.readback_artifact_id }} · nonce ${{ inputs.authorization_nonce }}

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Exact authorization purpose; INSTALL_ONLY only
        required: true
        type: string
      request_id:
        description: Canonical request binding digest
        required: true
        type: string
      readback_artifact_id:
        description: Opaque private readback artifact identifier
        required: true
        type: string
      authorization_nonce:
        description: Exact 64-hex nonce bound into the private readback
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: install-only-authorization
  cancel-in-progress: false

jobs:
  authorize:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.purpose == 'INSTALL_ONLY' }}
    runs-on: ubuntu-24.04
    environment: production-first-start
    timeout-minutes: 10
    steps:
      - name: Verify reviewed controller and authenticated private readback
        env:
          CONTROLLER_TOKEN: ${{ github.token }}
          PRIVATE_TOKEN: ${{ secrets.HFS_PRIVATE_READBACK_TOKEN }}
          HFS_PRIVATE_REPOSITORY: ${{ secrets.HFS_PRIVATE_REPOSITORY }}
          HFS_READBACK_WORKFLOW_PATH: ${{ secrets.HFS_READBACK_WORKFLOW_PATH }}
          HFS_READBACK_WORKFLOW_REF: ${{ secrets.HFS_READBACK_WORKFLOW_REF }}
          HFS_READBACK_JOB_NAME: ${{ secrets.HFS_READBACK_JOB_NAME }}
          HFS_PRIVATE_AUTHORIZATION_ISSUE: ${{ secrets.HFS_PRIVATE_AUTHORIZATION_ISSUE }}
          HFS_ED25519_SIGNING_KEY_PEM: ${{ secrets.HFS_ED25519_SIGNING_KEY_PEM }}
          HFS_AUTHORIZATION_PURPOSE: ${{ inputs.purpose }}
          HFS_AUTHORIZATION_REQUEST_ID: ${{ inputs.request_id }}
          HFS_AUTHORIZATION_NONCE: ${{ inputs.authorization_nonce }}
          HFS_READBACK_ARTIFACT_ID: ${{ inputs.readback_artifact_id }}
          READBACK_ARTIFACT_ID: ${{ inputs.readback_artifact_id }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          readonly api=https://api.github.com
          readonly signer_blob=b4006b25add2f622cf25a06d0cf7adce1d95b72e
          readonly work="$RUNNER_TEMP/install-only-authorization"
          readonly signer="$work/install-only-authorization.mjs"
          exec 3>&2
          phase=PREFLIGHT
          authorization_code=
          report_error() {
            local status=$?
            trap - ERR
            if [[ -n "$authorization_code" ]]; then
              printf 'INSTALL_ONLY_AUTHORIZATION_ERROR phase=%s exit=%d code=%s\n' "$phase" "$status" "$authorization_code" >&3
            else
              printf 'INSTALL_ONLY_AUTHORIZATION_ERROR phase=%s exit=%d\n' "$phase" "$status" >&3
            fi
            exit "$status"
          }
          parse_signer_refusal() {
            local target=$1
            local line=
            local extra=
            local candidate=
            local public_code=AUTH_UNKNOWN
            exec 4< "$work/signer.stderr"
            if IFS= read -r line <&4 && ! IFS= read -r extra <&4 &&
              [[ "$line" =~ ^AUTHORIZATION_REFUSED\ code=(AUTH_[A-Z0-9_]+)$ ]]; then
              candidate=${BASH_REMATCH[1]}
              case "$candidate" in
                AUTH_APPROVAL_COUNT|AUTH_APPROVAL_ENVIRONMENT|AUTH_APPROVAL_REVIEWER|AUTH_CANONICAL_NUMBER|AUTH_CANONICAL_TYPE|AUTH_CONTROLLER_ACTOR|AUTH_CONTROLLER_HEAD|AUTH_CONTROLLER_PULL_REQUEST|AUTH_CONTROLLER_REPOSITORY|AUTH_CONTROLLER_REQUEST|AUTH_CONTROLLER_RUN|AUTH_DIGEST|AUTH_DUPLICATE_RUN|AUTH_ENV_GITHUB_SHA|AUTH_ENV_HFS_AUTHORIZATION_NONCE|AUTH_ENV_HFS_AUTHORIZATION_PURPOSE|AUTH_ENV_HFS_AUTHORIZATION_REQUEST_ID|AUTH_ENV_HFS_ED25519_SIGNING_KEY_PEM|AUTH_ENV_HFS_PRIVATE_REPOSITORY|AUTH_ENV_HFS_READBACK_ARTIFACT_ID|AUTH_ENV_HFS_READBACK_JOB_NAME|AUTH_ENV_HFS_READBACK_WORKFLOW_PATH|AUTH_ENV_HFS_READBACK_WORKFLOW_REF|AUTH_EXPECTED_PROVENANCE|AUTH_EXPIRY|AUTH_HEAD_REPOSITORY|AUTH_NONCE|AUTH_PRIVATE_KEY|AUTH_PURPOSE|AUTH_READBACK_ARTIFACT|AUTH_READBACK_ARTIFACT_DIGEST|AUTH_READBACK_DIGEST|AUTH_READBACK_IDS|AUTH_READBACK_JOB|AUTH_READBACK_JSON|AUTH_READBACK_PULL_REQUEST|AUTH_READBACK_REPOSITORY|AUTH_READBACK_RUN|AUTH_READBACK_TIME|AUTH_RELEASE|AUTH_REQUEST_FIELDS|AUTH_REQUEST_ID|AUTH_RUN_INVENTORY_CURRENT|AUTH_RUN_INVENTORY_FIELDS|AUTH_RUN_INVENTORY_INCOMPLETE|AUTH_RUN_INVENTORY_QUERY|AUTH_SCOPE|AUTH_SMOKE_RUN_FORBIDDEN|AUTH_USAGE|AUTH_WORKFLOW_INPUTS)
                  public_code=$candidate
                  ;;
              esac
            fi
            exec 4<&-
            printf -v "$target" '%s' "$public_code"
          }
          fail_status() {
            return "$1"
          }
          quiet_capture() {
            local target=$1
            shift
            local value=
            local capture_status=0
            value=$("$@" 2>/dev/null) || capture_status=$?
            printf -v "$target" '%s' "$value"
            return "$capture_status"
          }
          cleanup() {
            local status=$?
            trap - ERR EXIT HUP INT TERM
            if [[ -d "$work" && ! -L "$work" ]]; then
              find "$work" -type f -exec shred -u -- {} + >/dev/null 2>&1 || true
              rm -rf -- "$work" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap report_error ERR
          trap cleanup EXIT HUP INT TERM

          [[ "$GITHUB_REPOSITORY" == Ronmel71/hfs-approval-controller ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]]
          [[ "$HFS_AUTHORIZATION_PURPOSE" == INSTALL_ONLY ]]
          [[ "$HFS_AUTHORIZATION_REQUEST_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$HFS_AUTHORIZATION_NONCE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$READBACK_ARTIFACT_ID" =~ ^[1-9][0-9]{5,19}$ ]]
          [[ "$HFS_PRIVATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$HFS_PRIVATE_AUTHORIZATION_ISSUE" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ -n "$PRIVATE_TOKEN" && -n "$HFS_ED25519_SIGNING_KEY_PEM" ]]
          mkdir -m 0700 -- "$work"

          controller_headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $CONTROLLER_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          private_headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $PRIVATE_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")

          phase=SOURCE_PIN
          curl --fail --silent --show-error --location "${controller_headers[@]}" \
            "$api/repos/$GITHUB_REPOSITORY/contents/scripts/install-only-authorization.mjs?ref=$GITHUB_SHA" > "$work/signer-source.json" 2>/dev/null
          quiet_capture source_blob jq -r .sha "$work/signer-source.json"
          [[ "$source_blob" == "$signer_blob" ]]
          jq -r .content "$work/signer-source.json" 2>/dev/null | base64 --decode > "$signer" 2>/dev/null
          quiet_capture actual_signer_blob git hash-object "$signer"
          [[ "$actual_signer_blob" == "$signer_blob" ]]

          phase=ARTIFACT_META
          curl --fail --silent --show-error --location "${private_headers[@]}" \
            "$api/repos/$HFS_PRIVATE_REPOSITORY/actions/artifacts/$READBACK_ARTIFACT_ID" > "$work/artifact.json" 2>/dev/null
          quiet_capture private_run_id jq -r .workflow_run.id "$work/artifact.json"
          [[ "$private_run_id" =~ ^[1-9][0-9]{5,19}$ ]]

          phase=ARTIFACT_ZIP
          curl --fail --silent --show-error --location "${private_headers[@]}" \
            "$api/repos/$HFS_PRIVATE_REPOSITORY/actions/artifacts/$READBACK_ARTIFACT_ID/zip" > "$work/readback.zip" 2>/dev/null

          phase=ZIP_MEMBERS
          unzip -Z1 "$work/readback.zip" > "$work/members-unsorted.txt" 2>/dev/null
          LC_ALL=C sort "$work/members-unsorted.txt" > "$work/members.txt" 2>/dev/null
          quiet_capture members cat "$work/members.txt"
          [[ "$members" == $'authorization-request.json\nstaged-readback.json' ]]
          unzip -p "$work/readback.zip" authorization-request.json > "$work/request.json" 2>/dev/null
          unzip -p "$work/readback.zip" staged-readback.json > "$work/readback.json" 2>/dev/null

          phase=REQUEST_PROVENANCE
          quiet_capture private_job_id jq -r .readbackJobId "$work/request.json"
          [[ "$private_job_id" =~ ^[1-9][0-9]{5,19}$ ]]

          curl --fail --silent --show-error --location "${private_headers[@]}" \
            "$api/repos/$HFS_PRIVATE_REPOSITORY/actions/runs/$private_run_id" > "$work/private-run.json" 2>/dev/null
          curl --fail --silent --show-error --location "${private_headers[@]}" \
            "$api/repos/$HFS_PRIVATE_REPOSITORY/actions/jobs/$private_job_id" > "$work/private-job.json" 2>/dev/null

          phase=NATIVE_APPROVAL
          curl --fail --silent --show-error --location "${controller_headers[@]}" \
            "$api/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$work/controller-run.json" 2>/dev/null
          curl --fail --silent --show-error --location "${controller_headers[@]}" \
            "$api/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$work/controller-approvals.json" 2>/dev/null

          phase=INVENTORY
          page=1
          while :; do
            printf -v page_path '%s/inventory-page-%06d.json' "$work" "$page"
            curl --fail --silent --show-error --location "${controller_headers[@]}" \
              "$api/repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=100&page=$page" > "$page_path" 2>/dev/null
            quiet_capture page_count jq -er '.workflow_runs | length' "$page_path"
            [[ "$page_count" =~ ^[0-9]+$ && "$page_count" -le 100 ]]
            if [[ "$page_count" -lt 100 ]]; then
              break
            fi
            page=$((page + 1))
          done
          jq -s --arg repository "$GITHUB_REPOSITORY" \
            '{schema:"hfs.production-first-start.install-only-run-inventory/v1",complete:true,query:{repository:$repository,event:"workflow_dispatch",perPage:100},pages:.}' \
            "$work"/inventory-page-*.json > "$work/controller-run-inventory.json" 2>/dev/null

          phase=SIGNER
          signer_status=0
          node "$signer" sign \
            "$work/request.json" "$work/readback.json" "$work/controller-run.json" "$work/controller-approvals.json" \
            "$work/controller-run-inventory.json" "$work/private-run.json" "$work/private-job.json" "$work/artifact.json" \
            > "$work/authorization.json" 2> "$work/signer.stderr" || signer_status=$?
          chmod 0600 "$work/signer.stderr"
          if [[ "$signer_status" -ne 0 ]]; then
            if [[ "$signer_status" -eq 78 ]]; then
              parse_signer_refusal authorization_code
            else
              authorization_code=
            fi
            fail_status "$signer_status"
          fi
          jq -e '.schema == "hfs.production-first-start.github-install-authorization-envelope/v1"' "$work/authorization.json" >/dev/null 2>&1
          jq -n --rawfile authorization "$work/authorization.json" \
            '{body:("INSTALL_ONLY_AUTHORIZATION\n\n```json\n" + $authorization + "```\n")}' > "$work/comment.json" 2>/dev/null

          phase=ISSUE_DELIVERY
          curl --fail --silent --show-error --location "${private_headers[@]}" \
            --request POST --data-binary @"$work/comment.json" \
            "$api/repos/$HFS_PRIVATE_REPOSITORY/issues/$HFS_PRIVATE_AUTHORIZATION_ISSUE/comments" > "$work/comment-response.json" 2>/dev/null
          jq -e '.id | numbers' "$work/comment-response.json" >/dev/null 2>&1
          printf 'INSTALL_ONLY_AUTHORIZATION_DELIVERED\n'
