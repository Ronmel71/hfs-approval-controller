name: HFS protected credential preflight (read-only)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: hfs-protected-credential-preflight
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    environment: production-first-start
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify Ed25519 key and scoped private-source read access
        shell: bash
        env:
          HFS_ED25519_SIGNING_KEY_PEM: ${{ secrets.HFS_ED25519_SIGNING_KEY_PEM }}
          HFS_PRIVATE_SOURCE_READ_TOKEN: ${{ secrets.HFS_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          node --input-type=module <<'NODE'
          import { createPrivateKey, createPublicKey, sign, verify } from "node:crypto";

          function fail(code) {
            process.stderr.write(code + "\n");
            process.exit(1);
          }

          const pem = process.env.HFS_ED25519_SIGNING_KEY_PEM;
          const token = process.env.HFS_PRIVATE_SOURCE_READ_TOKEN;
          if (!pem || !token) fail("CREDENTIAL_PREFLIGHT_MISSING");

          try {
            const privateKey = createPrivateKey(pem);
            if (privateKey.asymmetricKeyType !== "ed25519") fail("CREDENTIAL_PREFLIGHT_SIGNER_INVALID");
            const publicKey = createPublicKey(privateKey);
            const challenge = Buffer.from("hfs.protected-credential-preflight/v1", "utf8");
            const signature = sign(null, challenge, privateKey);
            if (signature.length !== 64 || !verify(null, challenge, publicKey, signature)) {
              fail("CREDENTIAL_PREFLIGHT_SIGNER_INVALID");
            }
          } catch {
            fail("CREDENTIAL_PREFLIGHT_SIGNER_INVALID");
          }

          async function getJson(path) {
            let response;
            try {
              response = await fetch("https://api.github.com" + path, {
                method: "GET",
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
                },
                redirect: "error",
                signal: AbortSignal.timeout(15000),
              });
            } catch {
              fail("CREDENTIAL_PREFLIGHT_READ_TRANSPORT_FAILED");
            }
            if (response.status !== 200) fail("CREDENTIAL_PREFLIGHT_READ_DENIED");
            try {
              return await response.json();
            } catch {
              fail("CREDENTIAL_PREFLIGHT_READ_RESPONSE_INVALID");
            }
          }

          const source = "/repos/Ronmel71/hfs-selger-app";
          const ref = await getJson(source + "/git/ref/heads/staging");
          if (ref.ref !== "refs/heads/staging" || !/^[a-f0-9]{40}$/.test(ref.object?.sha)) {
            fail("CREDENTIAL_PREFLIGHT_REF_INVALID");
          }

          const file = await getJson(
            source + "/contents/deploy/production/install-only-bundle/manifest.json?ref=" + ref.object.sha
          );
          if (file.type !== "file" || file.encoding !== "base64" || typeof file.content !== "string") {
            fail("CREDENTIAL_PREFLIGHT_CONTENT_INVALID");
          }
          let manifest;
          try {
            manifest = JSON.parse(Buffer.from(file.content.replace(/\s/g, ""), "base64").toString("utf8"));
          } catch {
            fail("CREDENTIAL_PREFLIGHT_CONTENT_INVALID");
          }
          if (manifest.repository !== "Ronmel71/hfs-selger-app" ||
              manifest.status !== "CODE_ONLY_BUNDLE_READY" ||
              manifest.consoleGo !== false || manifest.startAuthorized !== false) {
            fail("CREDENTIAL_PREFLIGHT_POLICY_INVALID");
          }

          process.stdout.write("CREDENTIAL_PREFLIGHT_PASS SIGNER_VALID PRIVATE_READ_VALID NO_WRITES NO_PUBLISH NO_DEPLOY\n");
          NODE
