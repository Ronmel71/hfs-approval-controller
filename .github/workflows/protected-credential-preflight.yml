name: HFS protected credential preflight (read-only)

on:
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: hfs-protected-credential-preflight
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    environment: production-first-start
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Verify isolated private readback access and native approval
        shell: bash
        env:
          CONTROLLER_TOKEN: ${{ github.token }}
          HFS_PRIVATE_READBACK_TOKEN: ${{ secrets.HFS_PRIVATE_READBACK_TOKEN }}
          HFS_PRIVATE_REPOSITORY: ${{ secrets.HFS_PRIVATE_REPOSITORY }}
          HFS_READBACK_WORKFLOW_PATH: ${{ secrets.HFS_READBACK_WORKFLOW_PATH }}
          HFS_READBACK_WORKFLOW_REF: ${{ secrets.HFS_READBACK_WORKFLOW_REF }}
          HFS_READBACK_JOB_NAME: ${{ secrets.HFS_READBACK_JOB_NAME }}
          HFS_PRIVATE_AUTHORIZATION_ISSUE: ${{ secrets.HFS_PRIVATE_AUTHORIZATION_ISSUE }}
        run: |
          set -Eeuo pipefail
          set +x
          node --input-type=module <<'NODE'
          function fail(code) {
            process.stderr.write(code + "\n");
            process.exit(1);
          }

          const expected = Object.freeze({
            controllerRepository: "Ronmel71/hfs-approval-controller",
            controllerWorkflowPath: ".github/workflows/protected-credential-preflight.yml",
            controllerBranch: "main",
            environmentName: "production-first-start",
            environmentId: 26423058762,
            reviewerLogin: "Ronmel71",
            reviewerId: 321374159,
            privateRepository: "Ronmel71/hfs-selger-app",
            privateWorkflowId: 379993056,
            privateWorkflowPath: ".github/workflows/first-start-runner-transfer.yml",
            privateWorkflowRef: "refs/heads/staging",
            privateJobName: "independent-install-only-readback",
            privateIssue: 288,
          });

          const controllerToken = process.env.CONTROLLER_TOKEN;
          const privateToken = process.env.HFS_PRIVATE_READBACK_TOKEN;
          const runId = process.env.GITHUB_RUN_ID;
          const controllerHead = process.env.GITHUB_SHA;

          if (!controllerToken || !privateToken) fail("READBACK_PREFLIGHT_AUTH_FAILED");
          if (process.env.GITHUB_REPOSITORY !== expected.controllerRepository ||
              process.env.GITHUB_REF !== `refs/heads/${expected.controllerBranch}` ||
              process.env.GITHUB_EVENT_NAME !== "workflow_dispatch" ||
              process.env.GITHUB_RUN_ATTEMPT !== "1" ||
              !/^[1-9][0-9]{5,19}$/.test(runId ?? "") ||
              !/^[0-9a-f]{40}$/.test(controllerHead ?? "")) {
            fail("READBACK_PREFLIGHT_REQUIRED_REVIEW_MISSING");
          }
          if (process.env.HFS_PRIVATE_REPOSITORY !== expected.privateRepository) {
            fail("READBACK_PREFLIGHT_REPOSITORY_MISMATCH");
          }
          if (process.env.HFS_READBACK_WORKFLOW_PATH !== expected.privateWorkflowPath ||
              process.env.HFS_READBACK_WORKFLOW_REF !== expected.privateWorkflowRef ||
              process.env.HFS_READBACK_JOB_NAME !== expected.privateJobName) {
            fail("READBACK_PREFLIGHT_WORKFLOW_MISMATCH");
          }
          if (process.env.HFS_PRIVATE_AUTHORIZATION_ISSUE !== String(expected.privateIssue)) {
            fail("READBACK_PREFLIGHT_ISSUE_MISMATCH");
          }

          async function getJson(path, token) {
            let response;
            try {
              response = await fetch(`https://api.github.com${path}`, {
                method: "GET",
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${token}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                },
                redirect: "error",
                signal: AbortSignal.timeout(10000),
              });
            } catch {
              fail("READBACK_PREFLIGHT_RESPONSE_INVALID");
            }
            if (response.status === 401) fail("READBACK_PREFLIGHT_AUTH_FAILED");
            if (response.status === 403) fail("READBACK_PREFLIGHT_SCOPE_DENIED");
            if (response.status === 404) fail("READBACK_PREFLIGHT_TARGET_NOT_FOUND_OR_HIDDEN");
            if (response.status !== 200) fail("READBACK_PREFLIGHT_RESPONSE_INVALID");
            try {
              return await response.json();
            } catch {
              fail("READBACK_PREFLIGHT_RESPONSE_INVALID");
            }
          }

          const privatePrefix = `/repos/${expected.privateRepository}`;
          const repository = await getJson(privatePrefix, privateToken);
          if (repository.full_name !== expected.privateRepository ||
              repository.private !== true || repository.fork !== false) {
            fail("READBACK_PREFLIGHT_REPOSITORY_MISMATCH");
          }

          const workflow = await getJson(
            `${privatePrefix}/actions/workflows/${expected.privateWorkflowId}`,
            privateToken
          );
          if (workflow.id !== expected.privateWorkflowId ||
              workflow.path !== expected.privateWorkflowPath || workflow.state !== "active") {
            fail("READBACK_PREFLIGHT_WORKFLOW_MISMATCH");
          }

          const issue = await getJson(`${privatePrefix}/issues/${expected.privateIssue}`, privateToken);
          if (issue.repository_url !== `https://api.github.com${privatePrefix}` ||
              issue.number !== expected.privateIssue || issue.state !== "open" ||
              Object.hasOwn(issue, "pull_request")) {
            fail("READBACK_PREFLIGHT_ISSUE_MISMATCH");
          }

          const controllerPrefix = `/repos/${expected.controllerRepository}`;
          const run = await getJson(`${controllerPrefix}/actions/runs/${runId}`, controllerToken);
          if (run.id !== Number(runId) || run.repository?.full_name !== expected.controllerRepository ||
              run.repository?.private !== false || run.repository?.fork !== false ||
              run.path !== expected.controllerWorkflowPath || run.head_branch !== expected.controllerBranch ||
              run.head_sha !== controllerHead || run.event !== "workflow_dispatch" ||
              run.run_attempt !== 1 || !Array.isArray(run.pull_requests) || run.pull_requests.length !== 0) {
            fail("READBACK_PREFLIGHT_REQUIRED_REVIEW_MISSING");
          }

          const approvals = await getJson(
            `${controllerPrefix}/actions/runs/${runId}/approvals`,
            controllerToken
          );
          if (!Array.isArray(approvals) || approvals.length !== 1) {
            fail("READBACK_PREFLIGHT_REQUIRED_REVIEW_MISSING");
          }
          const approval = approvals[0];
          if (approval.state !== "approved" || approval.user?.login !== expected.reviewerLogin ||
              approval.user?.id !== expected.reviewerId || !Array.isArray(approval.environments) ||
              approval.environments.length !== 1) {
            fail("READBACK_PREFLIGHT_REQUIRED_REVIEW_MISSING");
          }
          const environment = approval.environments[0];
          if (environment.id !== expected.environmentId || environment.name !== expected.environmentName) {
            fail("READBACK_PREFLIGHT_REQUIRED_REVIEW_MISSING");
          }
          for (const record of [approval, environment]) {
            if (Object.hasOwn(record, "can_admins_bypass") && record.can_admins_bypass !== false) {
              fail("READBACK_PREFLIGHT_REQUIRED_REVIEW_MISSING");
            }
          }

          process.stdout.write("READBACK_PREFLIGHT_PASS PRIVATE_ACTIONS_READ PRIVATE_ISSUE_READ NATIVE_REVIEW_VERIFIED NO_WRITES NO_SIGNING\n");
          NODE
